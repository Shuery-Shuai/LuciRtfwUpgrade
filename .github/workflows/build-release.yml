name: Build packages

# 双产物：25.12 SDK → .apk（ImmortalWrt/OpenWrt 25.x 用 apk），24.10 SDK → .ipk（仍用 opkg）
# 同一份步骤先在本地用 tools/build-local.sh 跑通，才推到这里。
on:
    push:
        tags: ['v*']
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - sdk: '25.12.0'
                      format: apk
                      url: https://downloads.openwrt.org/releases/25.12.0/targets/x86/64/openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
                    - sdk: '24.10.6'
                      format: ipk
                      url: https://downloads.openwrt.org/releases/24.10.6/targets/x86/64/openwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        name: SDK ${{ matrix.sdk }} (${{ matrix.format }})
        steps:
            - uses: actions/checkout@v4

            - name: 校验 tag 与 PKG_VERSION 一致
              # 发版 tag 必须恰好是 v${PKG_VERSION}（例如 v0.1.0_alpha1）；
              # 两者不一致会让 Release 上的版本号与包内版本对不上。
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  pkg=$(sed -n 's/^PKG_VERSION:=//p' luci-app-rtfwupgrade/Makefile | head -1 | tr -d '[:space:]')
                  want="v${pkg}"
                  if [ "${GITHUB_REF_NAME}" != "$want" ]; then
                    echo "tag 与 Makefile PKG_VERSION 不一致：tag=${GITHUB_REF_NAME}，期望 ${want}"
                    exit 1
                  fi
                  echo "tag 与 PKG_VERSION 一致：${GITHUB_REF_NAME}"
                  node tests/version-check.mjs

            - name: 安装依赖
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq zstd wget gawk bzip2 gettext libncurses-dev libssl-dev zlib1g-dev python3-setuptools
                  # GitHub runner 的 Python 3.12 没有 distutils，SDK 的主机依赖检查会因此失败；
                  # 这里只跳过该检查（依赖已按上面装齐），不影响包本身是 LUCI_PKGARCH:=all 的构建
                  echo "FORCE=1" >> "$GITHUB_ENV"

            - name: 下载并解包 SDK
              run: |
                  wget -q -O sdk.tar.zst "${{ matrix.url }}"
                  mkdir sdk
                  tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

            - name: 放入包并准备 feeds
              run: |
                  cd sdk
                  cp -r "$GITHUB_WORKSPACE/luci-app-rtfwupgrade" package/
                  # 拉全套 feeds：官方 i18n 机制（luci.mk 为 po/ 下每个语言生成
                  # luci-i18n-<app>-<lang> 包）需要 po2lmo，而 po2lmo 由 luci-base 构建，
                  # 后者依赖 liblua（packages feed）
                  ./scripts/feeds update -a
                  ./scripts/feeds install -a
                  make defconfig

            - name: 编译
              # 同时产出主包与 luci-i18n-rtfwupgrade-<lang> 语言包（官方机制）
              run: cd sdk && make package/luci-app-rtfwupgrade/compile V=s

            - name: 收集并校验产物
              run: |
                  mkdir -p out
                  find sdk/bin -name '*rtfwupgrade*' -type f -exec cp {} out/ \;
                  ls -l out
                  # 核对主包内容（.ipk 是 gzip 包裹的 tar，内层 data.tar.gz）
                  python3 tools/inspect-package.py out/*
                  # 语言包由 luci.mk 生成（官方机制），这里确认它确实产出了
                  ls out/ | grep -q 'luci-i18n-rtfwupgrade' || { echo "缺少 luci-i18n-rtfwupgrade 语言包"; exit 1; }

            - uses: actions/upload-artifact@v4
              with:
                  name: luci-app-rtfwupgrade-${{ matrix.format }}
                  path: out/*
                  if-no-files-found: error

    release:
        needs: build
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            # gh release create --generate-notes 需要 git 仓库来读提交历史；
            # 只下载产物会报「fatal: not a git repository」（已在 alpha1 上踩到）
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: 生成校验和
              # 只写文件名（不带 artifacts/<artifact名>/ 前缀）：用户从 Release 下载到的是
              # 扁平文件，带目录的清单没法直接 shasum -c（alpha1 上踩到过）
              run: |
                  cd artifacts
                  find . -type f -exec sha256sum {} \; | sed 's|  \./.*/|  |' | sort -k2 > ../SHA256SUMS
                  cat ../SHA256SUMS

            - name: 创建 Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # tag 含 alpha/beta/rc 时自动标为预发布（与 LuciFanXpert 的做法一致）
                  extra=""
                  case "${GITHUB_REF_NAME}" in
                    *alpha*|*beta*|*rc*) extra="--prerelease" ;;
                  esac
                  find artifacts -type f -maxdepth 2 | sed 's/^/  /'
                  gh release create "${GITHUB_REF_NAME}" \
                    --title "${GITHUB_REF_NAME}" \
                    --generate-notes \
                    $extra \
                    SHA256SUMS \
                    $(find artifacts -type f -maxdepth 2)

            - name: 回下载验证（清单必须能直接校验）
              # 把刚发布的附件重新下载到扁平目录，用发布的 SHA256SUMS 校验 ——
              # 这是对「用户拿到的东西」的端到端确认
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  mkdir -p /tmp/verify && cd /tmp/verify
                  gh release download "${GITHUB_REF_NAME}" --dir .
                  ls -l
                  sha256sum -c SHA256SUMS
