name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    static:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: JSON 校验
              run: |
                  fail=0
                  for f in $(find . -name '*.json' -not -path './.git/*'); do
                    python3 -m json.tool "$f" > /dev/null || { echo "FAIL $f"; fail=1; }
                  done
                  exit $fail

            - name: JS 语法
              run: |
                  fail=0
                  for f in $(find . -name '*.js' -not -path './.git/*'); do
                    node --check "$f" || { echo "FAIL $f"; fail=1; }
                  done
                  exit $fail

            # prettier 是阻塞检查：格式不一致会让 CI 直接失败，本地先跑
            # `npx --yes prettier@3 --write "**/*.{js,json,yml,md}"` 再提交。
            - name: 版本一致性（Makefile ↔ version.uc）
              run: node tests/version-check.mjs

            - name: i18n 检查（msgid 与 po 一致性）
              run: node tests/i18n-check.mjs

            - name: 视图渲染检查（Node 桩，无浏览器）
              run: node tests/render-check.mjs

            - name: 仓库一致性（旧标识/布局/CLI/菜单/lmo）
              run: node tests/consistency-check.mjs

            - name: prettier
              run: npx --yes prettier@3 --check "**/*.{js,json,yml,md}"

            - name: shellcheck
              # 包内 uci-defaults 没有 .sh 后缀，但会装到设备上执行，必须一并检查
              run: shellcheck tests/*.sh tools/*.sh luci-app-rtfwupgrade/root/etc/uci-defaults/*

            - name: 包目录文件必须都已入库
              # 踩过的坑：.gitignore 写成非锚定的 bin/，把 root/usr/bin/rtfwupgrade.sh 忽略了，
              # 于是本地构建（从工作区拷贝）有 CLI、CI 构建（checkout）没有 —— 产物缺主程序。
              # 只关心「被忽略」(`!!`) 与「未跟踪」(`??`) 两类：已暂存的改动本来就会进仓库。
              run: |
                  stray=$(git status --ignored --short -- luci-app-rtfwupgrade | grep -E '^(\?\?|!!)' || true)
                  if [ -n "$stray" ]; then
                    echo "这些文件在包目录里但不在仓库中（CI 会漏掉）："
                    echo "$stray"
                    exit 1
                  fi
                  echo "包目录内所有文件均已入库"

    ucode-syntax:
        runs-on: ubuntu-latest
        steps:
            # 注意：不能把 checkout 放进 openwrt/rootfs 容器里 —— 它是 musl 系统，
            # 而 actions/checkout 的 Node 二进制依赖 glibc，会以
            # 「exec /__e/node24/bin/node: no such file or directory」失败。
            # 因此：宿主机 checkout，再用 docker run 进容器做 ucode 检查。
            - uses: actions/checkout@v4

            - name: ucode 编译检查（openwrt/rootfs 容器）
              run: |
                  docker run --rm -v "$PWD:/src:ro" openwrt/rootfs:x86_64-25.12-SNAPSHOT sh -c '
                    apk update >/dev/null 2>&1 && apk add --no-cache ucode >/dev/null 2>&1
                    fail=0
                    for f in $(find /src/luci-app-rtfwupgrade -type f \( -name "*.uc" -o -path "*/usr/bin/rtfwupgrade.sh" -o -path "*/rpcd/ucode/rtfwupgrade" \)); do
                      ucode -c "$f" > /dev/null || { echo "FAIL $f"; fail=1; }
                    done
                    echo "检查了 $(find /src/luci-app-rtfwupgrade -type f \( -name "*.uc" -o -path "*/usr/bin/rtfwupgrade.sh" -o -path "*/rpcd/ucode/rtfwupgrade" \) | wc -l) 个 ucode 文件"
                    exit $fail
                  '

            - name: 刷写行为回归（容器，护栏/boot_check/命令形态）
              # 踩过的坑：dsn 里把 sysupgrade 的命令形态写成 -n 会把用户配置清空；
              # 落盘与起进程顺序颠倒则断电后再也查不到这次刷写。这里用假 sysupgrade
              # 垫片（PATH 前置，绝不真刷）+ 假 curl fixture（不走网络）跑行为断言。
              # 容器里 /etc 可写，ensure_state_writable() 会通过，全部断言执行。
              run: |
                  docker run --rm -v "$PWD:/src:ro" openwrt/rootfs:x86_64-25.12-SNAPSHOT sh -c '
                    apk update >/dev/null 2>&1 && apk add --no-cache ucode ucode-mod-fs ucode-mod-uci ucode-mod-digest >/dev/null 2>&1 || { echo "ucode modules install failed"; exit 2; }
                    PATH=/tmp/rtfwupgrade-unit/bin:$PATH \
                      ucode -L /src/luci-app-rtfwupgrade/root/usr/share/ucode /src/tests/flash-unit.uc
                  '

            - name: scheduler 行为回归（容器，块外内容必须保留）
              # 踩过的坑：strip_block() 返回数组，连续剥新旧两块时若直接传数组，
              # sync() 会清空 crontab 的块外内容；这里用真实 uci/fs 模块跑行为断言。
              run: |
                  docker run --rm -v "$PWD:/src:ro" openwrt/rootfs:x86_64-25.12-SNAPSHOT sh -c '
                    apk update >/dev/null 2>&1 && apk add --no-cache ucode ucode-mod-fs ucode-mod-uci >/dev/null 2>&1 || { echo "ucode modules install failed"; exit 2; }
                    ucode -L /src/luci-app-rtfwupgrade/root/usr/share/ucode /src/tests/scheduler-unit.uc
                  '
